name: Publish Mooze to PyPI

# This workflow only runs when you publish a new Release on GitHub
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing (OIDC)
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: python -m pip install build twine

      - name: Build the Package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No passwords needed! This official action handles the secure token handshake.
