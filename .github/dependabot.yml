version: 2
updates:
  # Maintain dependencies for Python/Pip
  - package-ecosystem: "pip"
    
    # Look for the pyproject.toml or requirements.txt in the root directory
    directory: "/"
    
    # Check for updates once a week
    schedule:
      interval: "weekly"
      
    # (Optional) Assign reviewers automatically to the PRs
    reviewers:
      - "X0fx"